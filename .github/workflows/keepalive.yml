name: Keep-alive (backup pinger)

# Backup for cron-job.org / UptimeRobot. GitHub may delay scheduled runs, so this is
# redundancy, not the primary keep-alive. Set repository variables API_URL and WEB_URL.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping API readiness
        run: |
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 30 "${{ vars.API_URL }}/health/ready")
          echo "API /health/ready -> $code: $(cat /tmp/ready.json)"
          test "$code" = "200"
      - name: Ping web
        if: ${{ vars.WEB_URL != '' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.WEB_URL }}")
          echo "web -> $code"
          test "$code" = "200"
